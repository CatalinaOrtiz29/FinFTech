name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (API + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Pruebas unitarias e integraciÃƒÂ³n
        run: npm test

  frontend:
    name: Frontend (build + marca)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generar las pÃƒÂ¡ginas desde el diseÃƒÂ±o de Stitch
        run: node frontend/build.js
      - name: Verificar que la marca sea coherente (sin ChaosCore)
        run: |
          if grep -R "ChaosCore" frontend/public; then
            echo "Se encontraron referencias a una marca incorrecta"; exit 1
          fi
          echo "Marca FinFTech coherente"
