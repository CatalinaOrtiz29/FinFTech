# FinFTech frontend - Nginx
# Sirve la SPA estÃƒÂ¡tica y hace de reverse proxy hacia la API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el servicio de la API dentro de la red de Docker.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health {
        proxy_pass http://api:3000/health;
    }
}
