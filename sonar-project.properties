# FinFTech - configuracion del analisis estatico con SonarQube
#
# Uso (con el perfil "quality" levantado y un token generado):
#   docker compose --profile quality run --rm -e SONAR_TOKEN=<token> sonar-scanner
#
# SonarQube queda en http://localhost:9000 (admin / ver SONAR_ADMIN_PASSWORD).

sonar.projectKey=finftech
sonar.projectName=FinFTech
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Codigo propio del proyecto (no se analiza el diseno de Stitch ni dependencias).
sonar.sources=backend/src,frontend/public/assets/js,frontend/public/assets/css,frontend/build.js,frontend/server.js,k6

# Pruebas automatizadas del backend.
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.test.js

sonar.exclusions=**/node_modules/**,**/_stitch_source/**,**/*.min.js,**/results/**,**/data/**,**/*.db

# Cobertura LCOV generada por las pruebas del backend:
#   cd backend && node --test --experimental-test-coverage \
#     --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
#     tests/integration/api.test.js tests/unit/wallet.test.js
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.javascript.file.suffixes=.js,.mjs
